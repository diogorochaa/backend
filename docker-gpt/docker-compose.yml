services:

  frontend:
    build:
      context: ./frontend
    container_name: docker-lab-frontend
    ports:
      - "3000:3000"
    networks:
      - app-network
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    container_name: docker-lab-backend
    ports:
      - "4000:4000"
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: app
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
    networks:
      - app-network
    depends_on:
      - postgres

  postgres:
    image: postgres:17-alpine
    container_name: docker-lab-postgres
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
